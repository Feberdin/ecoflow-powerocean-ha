# Purpose: Block newly introduced credentials before they can be merged unnoticed.
# Input/Output: Sends each push and pull-request commit range to the central Gitleaks workflow.
# Invariants: Read-only token and immutable central workflow commit.
# Debugging: Reproduce locally with `gitleaks git . --redact=100 --no-banner`.

name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    uses: Feberdin/security-watchdog/.github/workflows/reusable-secret-scan.yml@81ccc11d2b5606477183bb32a4ff8ed493b5d4ae
